<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BACK TO X — Admin</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0d0d0d;
      color:#fff;
    }
    header{
      padding:22px;
      border-bottom:1px solid #333;
      position:sticky;
      top:0;
      background:#0d0d0d;
      z-index:10;
    }
    header h1{margin:0;font-size:24px}
    header p{margin:6px 0 0;color:#999}
    main{padding:20px;max-width:1000px;margin:auto}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:16px;
    }
    .card{
      background:#171717;
      border:1px solid #292929;
      border-radius:14px;
      padding:20px;
    }
    .card h2{margin-top:0}
    button{
      border:0;
      border-radius:8px;
      padding:11px 16px;
      background:#fff;
      color:#000;
      font-weight:bold;
      cursor:pointer;
    }
    .status{
      margin-top:20px;
      padding:15px;
      border-radius:10px;
      background:#111;
      color:#aaa;
    }
    input,textarea{
      width:100%;
      margin:8px 0;
      padding:12px;
      border-radius:8px;
      border:1px solid #333;
      background:#0d0d0d;
      color:#fff;
    }
    textarea{min-height:100px;resize:vertical}
    .hidden{display:none}
#loginScreen{
  max-width:400px;
  margin:80px auto;
  padding:30px;
  background:#171717;
  border:1px solid #333;
  border-radius:16px;
  text-align:center;
}

#loginScreen h2{
  margin-top:0;
}

#loginScreen input{
  margin:15px 0;
}

#loginScreen button{
  width:100%;
}

#loginMessage{
  color:#f55;
}  
</style>

<style>
.premium-play{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  margin-top:8px;
  padding:13px 18px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:12px;
  background:linear-gradient(135deg,#ffffff,#bdbdbd);
  color:#080808;
  font-weight:800;
  letter-spacing:.5px;
  box-shadow:0 8px 25px rgba(255,255,255,.12);
  transition:.25s ease;
}
.premium-play:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(255,255,255,.22);
}
.premium-play span{
  font-size:18px;
}
.video-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.video-box{
  width:min(900px,100%);
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 25px 80px rgba(0,0,0,.7);
}
.video-box iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  display:block;
}
.video-close{
  width:100%;
  padding:12px;
  background:#171717;
  color:#fff;
  border:0;
  font-weight:bold;
}
</style>

</head>

<body>
<div id="loginScreen">
  <h2>BACK TO X — ADMIN LOGIN</h2>
  <input id="adminPassword" type="password" placeholder="Admin Password">
  <button onclick="adminLogin()">LOGIN</button>
  <p id="loginMessage"></p>
</div>
<header>
  <h1>BACK TO X — ADMIN</h1>
  <p>Content Management Dashboard</p>
</header>

<main>

  <div class="grid">

    <section class="card">
      <h2>Hero</h2>
      <input id="heroTitle" placeholder="Hero title">
      <input id="heroSubtitle" placeholder="Hero subtitle">
      <button onclick="saveHero()">Save Hero</button>
    </section>

    <section class="card">
      <h2>Episodes</h2>
      <input id="episodeTitle" placeholder="Episode title">
      <textarea id="episodeDescription" placeholder="Episode description"></textarea>
      <input id="episodeVideo" placeholder="Video URL">
      <input id="episodeImage" placeholder="Image URL">
<button type="button" class="premium-play" onclick="previewEpisode()">
  <span>▶</span> PREVIEW EPISODE
</button>

      <button onclick="addEpisode()">Add Episode</button>
    </section>

    <section class="card">
      <h2>Cast</h2>
      <input id="castName" placeholder="Name">
      <input id="castRole" placeholder="Role">
      <textarea id="castBio" placeholder="Bio"></textarea>
      <input id="castImage" placeholder="Image URL">
      <button onclick="addCast()">Add Cast Member</button>
    </section>

    <section class="card">
      <h2>Stories</h2>
      <input id="storyAuthor" placeholder="Author name">
      <textarea id="storyText" placeholder="Story"></textarea>
      <input id="storyImage" placeholder="Image URL">
      <button onclick="addStory()">Add Story</button>
    </section>

    <section class="card">
      <h2>Messages</h2>
      <textarea id="messageText" placeholder="Message"></textarea>
      <button onclick="addMessage()">Add Message</button>
    </section>

  </div>

  <div class="status" id="status">
    Connecting to Cloudflare D1...
  </div>

</main>

<script src="config.js"></script>

<script>
const API = "/api/content";

async function loadData(){
  try{
    const response = await fetch(API);
    const data = await response.json();

    document.getElementById("status").textContent =
      "CONNECTED — Cloudflare D1 is working.";
      
    if(data.settings){
      document.getElementById("heroTitle").value =
        data.settings.hero_title || "";
      document.getElementById("heroSubtitle").value =
        data.settings.hero_subtitle || "";
    }
  }catch(error){
    document.getElementById("status").textContent =
      "ERROR — Could not connect to Cloudflare D1.";
    console.error(error);
  }
}

async function send(data){
  const response = await fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(data)
  });

  return response.json();
}

async function saveHero(){
  const result = await send({
    action:"saveHero",
    hero_title:document.getElementById("heroTitle").value,
    hero_subtitle:document.getElementById("heroSubtitle").value
  });

  alert(result.message || "Hero saved");
}

async function addEpisode(){
  const result = await send({
    action:"addEpisode",
    title:document.getElementById("episodeTitle").value,
    description:document.getElementById("episodeDescription").value,
    video_url:document.getElementById("episodeVideo").value,
    image_url:document.getElementById("episodeImage").value
  });

  alert(result.message || "Episode added");
}

async function addCast(){
  const result = await send({
    action:"addCast",
    name:document.getElementById("castName").value,
    role:document.getElementById("castRole").value,
    bio:document.getElementById("castBio").value,
    image_url:document.getElementById("castImage").value
  });

  alert(result.message || "Cast member added");
}

async function addStory(){
  const result = await send({
    action:"addStory",
    author_name:document.getElementById("storyAuthor").value,
    story:document.getElementById("storyText").value,
    image_url:document.getElementById("storyImage").value
  });

  alert(result.message || "Story added");
}

async function addMessage(){
  const result = await send({
    action:"addMessage",
    message:document.getElementById("messageText").value
  });

  alert(result.message || "Message added");
}
document.querySelector("main").style.display = "none";

async function adminLogin(){
  const password = document.getElementById("adminPassword").value;
  const message = document.getElementById("loginMessage");

  const response = await fetch("/api/admin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "login",
      password: password
    })
  });

  const result = await response.json();

  if(result.success){
    document.getElementById("loginScreen").style.display = "none";
    document.querySelector("main").style.display = "block";
    loadData();
  }else{
    message.textContent = result.error || "Login failed";
  }
}
loadData();
</script>


<div class="video-modal" id="videoModal">
  <div class="video-box">
    <iframe id="videoFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <button class="video-close" onclick="closeVideo()">CLOSE</button>
  </div>
</div>

<script>
function getYoutubeId(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")) return u.searchParams.get("v");
  }catch(e){}
  return null;
}

function previewEpisode(){
  const url = document.getElementById("episodeVideo").value.trim();
  const id = getYoutubeId(url);

  if(!id){
    alert("Please enter a valid YouTube link.");
    return;
  }

  document.getElementById("videoFrame").src =
    "https://www.youtube.com/embed/" + id + "?autoplay=1";

  document.getElementById("videoModal").style.display = "flex";
}

function closeVideo(){
  document.getElementById("videoFrame").src = "";
  document.getElementById("videoModal").style.display = "none";
}
</script>

</body>
</html>
